<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 뽀모도로 타이머</title>
  <!-- CSS 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="tab-nav">
    <button id="tab-timer-btn" class="active-tab">타이머</button>
    <button id="tab-stats-btn">통계 및 기록</button>
  </nav>

  <section id="timer-section">
    <div class="timer-container">
      <h1>Pomodoro Timer</h1>
      <!-- 타이머 숫자 표시 영역 -->
      <div id="timer" class="timer-display">25:00</div>

      <!-- 컨트롤 버튼 영역 -->
      <div class="button-group">
        <button id="start-btn">시작</button>
        <button id="pause-btn">일시정지</button>      <button id="reset-btn">리셋</button>
      </div>

      <div class="input-group">
          <label for="time-input">시간 설정(분): </label>
          <input type="number" id="time-input" value="25" min="1" max="60">
          <button id="set-time-btn">설정</button>
      </div>
    </div>
  </section>

  <section id="stats-section" style="display: none;">
    <div class="calendar-header">
      <button id="prev-month-btn">&lt;</button>
      <h2 id="current-month-display">2026년 10월</h2>
      <button id="next-month-btn">&gt;</button>
    </div>

    <div class="calendar-grid">
      <div class="day-name">일</div><div class="day-name">월</div><div class="day-name">화</div>
      <div class="day-name">수</div><div class="day-name">목</div><div class="day-name">금</div><div class="day-name">토</div>
      <!-- 자바스크립트로 날짜 셀들이 동적 생성됨 -->
      <div id="calendar-days" class="days-container"></div>
    </div>

    <hr>

    <div class="history-container">
      <h3>작업 기록</h3>
      <button id="clear-history-btn">기록 전체 삭제</button>
      <ul id="history-list">

      </ul>
      <div id="stats-display"></div>
    </div>
  </section>



  <!-- JavaScript 파일 연결 -->
  <script src="script.js"></script>
</body>
</html>
