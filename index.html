<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 뽀모도로 타이머</title>
  <!-- CSS 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="timer-container">
    <h1>Pomodoro Timer</h1>

    <!-- 타이머 숫자 표시 영역 -->
    <div id="timer" class="timer-display">25:00</div>

    <!-- 컨트롤 버튼 영역 -->
    <div class="button-group">
      <button id="start-btn">시작</button>
      <button id="pause-btn">일시정지</button>      <button id="reset-btn">리셋</button>
    </div>

    <div class="input-group">
        <label for="time-input">시간 설정(분): </label>
        <input type="number" id="time-input" value="25" min="1" max="60">
        <button id="set-time-btn">설정</button>
    </div>
  </div>

  <!-- JavaScript 파일 연결 -->
  <script src="script.js"></script>
</body>
</html>
